<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Buddy</title>
        <script>
            // Basic polyfills (Buffer loaded in main.tsx)
            window.global = globalThis;
            window.process = { env: { NODE_ENV: 'production' } };
        </script>

        <!-- PWA Meta Tags -->
        <meta name="theme-color" content="#e9f4f9" />
        <meta name="description" content="Buddy — capture, plan, reflect" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <!-- `default` keeps the status bar opaque with dark glyphs. `black-translucent`
             draws white glyphs over our light (#e9f4f9) background — unreadable on a
             notch/Dynamic Island device. Safe-area insets are still applied in
             MainLayout for landscape and Android gesture nav. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Buddy" />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
